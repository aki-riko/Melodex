services:
  postgres:
    image: postgres:18.4-alpine
    container_name: melodex-postgres
    restart: unless-stopped
    environment:
      TZ: Asia/Shanghai
      POSTGRES_DB: ${POSTGRES_DB:-melodex}
      POSTGRES_USER: ${POSTGRES_USER:-melodex}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
    volumes:
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 10s
      timeout: 5s
      retries: 10

  provider:
    build:
      context: .
      dockerfile: backend/provider_bridge/Dockerfile
    image: ${MELODEX_PROVIDER_IMAGE:-melodex-provider:apache-2.0}
    container_name: melodex-provider
    restart: unless-stopped
    init: true
    read_only: true
    cap_drop:
      - ALL
    tmpfs:
      - /tmp
    environment:
      MELODEX_PROVIDER_HOST: 0.0.0.0
      MELODEX_PROVIDER_PORT: ${MELODEX_PROVIDER_PORT:-8840}
      MELODEX_PROVIDER_WORK_DIR: /tmp/melodex-provider
      XDG_STATE_HOME: /tmp/melodex-provider/state
    healthcheck:
      test: ["CMD", "python", "-c", "import os,urllib.request; urllib.request.urlopen('http://127.0.0.1:'+os.environ['MELODEX_PROVIDER_PORT']+'/health', timeout=5).read()"]
      interval: 15s
      timeout: 6s
      retries: 5
      start_period: 30s

  melodex:
    build:
      context: .
      dockerfile: Dockerfile
    # 默认用本地构建出来的 melodex:latest;想在 .env 里换成预构建镜像就设 MELODEX_IMAGE
    # (如 MELODEX_IMAGE=ghcr.io/aki-riko/melodex:edge),再 docker compose up -d --no-build
    image: ${MELODEX_IMAGE:-melodex:latest}
    container_name: melodex
    restart: unless-stopped
    ports:
      - "8329:8329"
    depends_on:
      postgres:
        condition: service_healthy
      provider:
        condition: service_healthy
    volumes:
      # 持久化:下载的音乐、cookie、生成的视频、settings.db 等都在 data 下
      - ./data:/home/appuser/data
      # 下载落盘位置。默认仍是 data/downloads —— 容器内路径不变,所以应用里的「下载目录」
      # 设置、已下载记录(relPath 相对下载目录)、本地音乐库全部照旧,不需要动任何应用设置。
      # 想换到别处(例如给 Plex/Navidrome 扫的媒体目录),在 .env 里设宿主绝对路径即可:
      #   MELODEX_DOWNLOAD_DIR=/mnt/user/media/Music
      # 两个前提:① 先把宿主目录建好并 chown 1000:1000(容器内 appuser),否则下载写入会
      # Permission denied;② 换了目录要把 data/downloads 里已有的文件搬过去,否则「已下载」
      # 里那些记录会因文件不在而消失。
      - ${MELODEX_DOWNLOAD_DIR:-./data/downloads}:/home/appuser/data/downloads
    environment:
      TZ: Asia/Shanghai
      MUSIC_DL_DATABASE_DRIVER: postgres
      MUSIC_DL_DATABASE_DSN: host=postgres user=${POSTGRES_USER:-melodex} password=${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env} dbname=${POSTGRES_DB:-melodex} port=5432 sslmode=disable TimeZone=Asia/Shanghai
      MUSIC_DL_LEGACY_SQLITE_DB: /home/appuser/data/settings.db
      MUSIC_DL_PROVIDER_URL: http://provider:${MELODEX_PROVIDER_PORT:-8840}
      # 搜索扇出预算: 所有源同时起跑, 一次搜索最多等这么久, 超时的源本次不参与(结果丢弃)。
      # 实测(limit=20)各源耗时: QQ 1.7s / 网易原生 1.0s / qianqian 18.7s / kugou 25.2s /
      # kuwo 83.7s / migu 114.9s / 快照版网易 131.7s —— 默认 60s 会让每次搜索都等满一分钟,
      # 而且慢源照样被丢。收到 12s 后 QQ+网易(原生)足够在 1~2s 内返回, 整体从 60s 降到 12s。
      # 想换回"等更久、尽量多收几个源", 调大这个值即可(Go duration, 如 30s/1m)。
      MUSIC_DL_SEARCH_SOURCE_BUDGET: ${MUSIC_DL_SEARCH_SOURCE_BUDGET:-12s}
      # Web 登录会话默认 180 天;可按需改天数,或用 MUSIC_DL_SESSION_MAX_AGE=720h 这类 Go duration。
      # MUSIC_DL_SESSION_DAYS: "180"
      # Subsonic API facade(默认关):配齐下面三项才启用,音流/substreamer 等
      # 标准 Subsonic 客户端即可连本服务搜全网/在线听/听过自动入库。
      # 凭据为客户端登录用的用户名与密码(强密码),禁止用默认值对外暴露。
      # MUSIC_DL_SUBSONIC_ENABLED: "1"
      # MUSIC_DL_SUBSONIC_USER: changeme
      # MUSIC_DL_SUBSONIC_PASS: please-set-a-strong-password
      # 听歌识曲(默认关):配 provider + 对应服务密钥后启用。录音不落盘,后端转发给识曲服务。
      # 在 .env 填下面变量即可启用;默认空值保持关闭。
      MUSIC_DL_RECOGNITION_PROVIDER: ${MUSIC_DL_RECOGNITION_PROVIDER:-}
      MUSIC_DL_RECOGNITION_TIMEOUT: ${MUSIC_DL_RECOGNITION_TIMEOUT:-}
      MUSIC_DL_RECOGNITION_MAX_BYTES: ${MUSIC_DL_RECOGNITION_MAX_BYTES:-}
      MUSIC_DL_RECOGNITION_RATE_LIMIT_PER_MINUTE: ${MUSIC_DL_RECOGNITION_RATE_LIMIT_PER_MINUTE:-}
      MUSIC_DL_AUDD_ENDPOINT: ${MUSIC_DL_AUDD_ENDPOINT:-}
      MUSIC_DL_AUDD_TOKEN: ${MUSIC_DL_AUDD_TOKEN:-}
      MUSIC_DL_AUDD_RETURN: ${MUSIC_DL_AUDD_RETURN:-}
      MUSIC_DL_ACRCLOUD_ENDPOINT: ${MUSIC_DL_ACRCLOUD_ENDPOINT:-}
      MUSIC_DL_ACRCLOUD_ACCESS_KEY: ${MUSIC_DL_ACRCLOUD_ACCESS_KEY:-}
      MUSIC_DL_ACRCLOUD_ACCESS_SECRET: ${MUSIC_DL_ACRCLOUD_ACCESS_SECRET:-}

volumes:
  postgres_data:
