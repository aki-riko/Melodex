<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <link rel="icon" type="image/svg+xml" href="/icon.svg" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png" />
    <!-- viewport-fit=cover 是必须的: 全局多处用 env(safe-area-inset-*) 给刘海屏/底部
         手势条留位(主滚动区、播放条、移动 Tab 栏)。没有 viewport-fit=cover 时, iOS 上
         env(safe-area-inset-*) 恒为 0 —— 那些留白全部失效, 内容会被底部手势条压住。 -->
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#181818" />
    <!-- 原生控件(滚动条/select/日期选择器)跟随当前主题的 color-scheme。
         必须是 both 而不是 dark:浅色的 Fluent 主题若被这条锁成暗色,
         原生下拉框/滚动条会保持黑底,在白色界面上像一块补丁。
         具体是暗是亮由 index.css 的 :root / [data-theme] 里的 color-scheme 决定。 -->
    <meta name="color-scheme" content="both" />
    <meta
      name="description"
      content="Melodex — 音乐发现与多源下载二合一"
    />
    <link rel="apple-touch-icon" href="/logo192.png" />
    <!-- Open Graph meta tags -->
    <meta property="og:title" content="Melodex" />
    <meta property="og:description" content="音乐发现与多源下载二合一" />
    <meta property="og:image" content="/logo192.png" />
    <meta property="og:type" content="website" />

    <title>Melodex</title>
    <!-- 主题首帧注入。
         为什么必须内联、且必须在这里:主题是 <html data-theme> 上的一个属性,
         如果等 React 挂载后再写,选了 Fluent 的用户每次打开都会先闪一下 Spotify 皮肤
         (背景色/圆角跳变)。这段脚本在样式与脚本加载前就把属性写好,首帧即正确。
         主题清单的真相在 src/theme/themes.js;这里的 id 列表由
         scripts/themeContract.test.mjs 强制与之一致,增删主题会被测试拦下。 -->
    <script>
      (function () {
        var DEFAULT_THEME = 'spotify';
        var THEME_IDS = ['spotify', 'fluent'];
        var id = DEFAULT_THEME;
        try {
          var stored = window.localStorage.getItem('melodex_theme');
          if (stored && THEME_IDS.indexOf(stored) !== -1) id = stored;
        } catch (error) {
          /* 无痕模式/禁用存储:用默认主题,不阻断启动 */
        }
        document.documentElement.setAttribute('data-theme', id);
      })();
    </script>
  </head>
  <body>
    <noscript>需要启用 JavaScript 才能运行 Melodex。</noscript>
    <div id="root"></div>
    <script type="module" src="/src/index.js"></script>
  </body>
</html>
