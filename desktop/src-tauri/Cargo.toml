[package]
name = "melodex-desktop-lyrics"
version = "0.1.0"
description = "Melodex Windows/macOS desktop shell wrapping the Melodex PWA"
authors = ["Kotori <kotori@9li.life>"]
edition = "2021"
license = "AGPL-3.0-only"

[build-dependencies]
tauri-build = { version = "=2.5.4", features = [] }

[dependencies]
autostart = { package = "tauri-plugin-autostart", version = "2.5.1" }
global_shortcut = { package = "tauri-plugin-global-shortcut", version = "2.3.2" }
reqwest = { version = "=0.12.28", default-features = false, features = ["json", "rustls-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
single_instance = { package = "tauri-plugin-single-instance", version = "2.4.5" }
tauri = { version = "=2.10.1", features = ["image-png", "macos-private-api", "tray-icon"] }

[features]
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]
